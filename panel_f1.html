<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente — Solón · Klimm</title>
<style>
:root{
  --fondo:#F5F9FA; --superficie:#FFFFFF; --tinta:#16323B; --tinta-suave:#5A7480;
  --agua:#0FA3C7; --agua-oscuro:#0B7E9A; --agua-claro:#E3F4F9;
  --ok:#1B9E63; --ok-bg:#E8F6EF; --media:#C7871B; --media-bg:#FBF3E3;
  --alerta:#C43D3D; --alerta-bg:#FBECEC; --revision:#B06A00; --revision-bg:#FFF6E8;
  --borde:#DCE7EB; --radio:10px;
  --wa:#25D366; --wa-oscuro:#1DA851;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--tinta);font-size:15px;line-height:1.5}
.contenedor{max-width:1080px;margin:0 auto;padding:0 20px}

/* Encabezado — mismo patrón que Cotizador y Costos */
header{background:var(--superficie);border-bottom:1px solid var(--borde);padding:14px 0;position:sticky;top:0;z-index:40}
header .contenedor{display:flex;align-items:baseline;justify-content:space-between}
.marca{font-size:20px;font-weight:700;letter-spacing:-.3px}
.marca span{color:var(--agua)}
.sistema{font-size:12px;color:var(--tinta-suave);letter-spacing:.8px;text-transform:uppercase}

/* Distribución de dos columnas: cola + detalle */
.tablero{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:24px 0 60px}

/* Columna de la cola */
.cola-cabecera{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cola-cabecera h2{font-size:15px;font-weight:600}
.cola-conteo{font-size:12px;color:var(--tinta-suave)}
.cola-conteo strong{color:var(--agua-oscuro);font-size:14px}
.cola{display:flex;flex-direction:column;gap:8px}

.lead-item{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:12px 14px;cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.lead-item:hover{border-color:var(--agua)}
.lead-item.activo{border-color:var(--agua);box-shadow:0 0 0 1px var(--agua)}
.lead-item.enviado{opacity:.55}
.lead-item.bloqueado{border-left:4px solid var(--alerta)}
.lead-item .li-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lead-item .li-nombre{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-item .li-hora{font-size:11px;color:var(--tinta-suave);flex-shrink:0}
.lead-item .li-pedido{font-size:12.5px;color:var(--tinta-suave);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-item .li-estado{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Punto de "nuevo" con pulso — única motion no disparada por el usuario */
.pulso{width:8px;height:8px;border-radius:50%;background:var(--agua);flex-shrink:0;position:relative}
.lead-item.nuevo .pulso::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--agua);animation:latir 1.6s ease-out infinite}
@keyframes latir{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.lead-item.nuevo .pulso::after{animation:none;opacity:.5}}

/* Chips — reusados del cotizador */
.chip{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:12px;letter-spacing:.3px;display:inline-block}
.chip-nuevo{background:var(--agua-claro);color:var(--agua-oscuro)}
.chip-ia{background:var(--ok-bg);color:var(--ok)}
.chip-base{background:var(--fondo);color:var(--tinta-suave);border:1px solid var(--borde)}
.chip-rojo{background:var(--alerta-bg);color:var(--alerta)}
.chip-enviado{background:var(--ok-bg);color:var(--ok)}

/* Columna de detalle */
.detalle{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:0;overflow:hidden;align-self:start;position:sticky;top:84px}
.detalle.rojo{border-color:var(--alerta)}
.det-cabecera{padding:20px 22px 16px;border-bottom:1px solid var(--borde)}
.det-cabecera.rojo{background:var(--alerta-bg);border-bottom-color:#F0C9C9}
.det-nombre{font-size:20px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.det-sub{font-size:13px;color:var(--tinta-suave);margin-top:2px}
.det-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.det-meta .campo .et{font-size:11px;color:var(--tinta-suave);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.det-meta .campo .va{font-size:14px;font-weight:600;margin-top:1px}

.det-cuerpo{padding:20px 22px}
.bloque{margin-bottom:18px}
.bloque-et{font-size:11px;color:var(--tinta-suave);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px}
.pidio-texto{background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:11px 13px;font-size:14px;color:var(--tinta);font-style:italic}
.pidio-vacio{color:var(--tinta-suave);font-style:italic}

/* Mensaje editable — el corazón operativo */
.mensaje-caja{position:relative}
textarea.mensaje{width:100%;min-height:120px;padding:13px 14px;border:1px solid var(--borde);border-radius:8px;font-size:14.5px;font-family:inherit;line-height:1.55;background:var(--superficie);color:var(--tinta);resize:vertical}
textarea.mensaje:focus{outline:2px solid var(--agua);outline-offset:-1px;border-color:var(--agua)}
.mensaje-pie{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mensaje-nota{font-size:12px;color:var(--tinta-suave)}
.restaurar{background:none;border:none;color:var(--agua-oscuro);cursor:pointer;font-size:12.5px;font-weight:600;text-decoration:underline;font-family:inherit}

/* Avisos del parser — reusa el patrón del cotizador */
.aviso{font-size:12.5px;color:var(--revision);margin-top:8px;padding-left:20px;position:relative}
.aviso::before{content:'⚠';position:absolute;left:0}
.bloqueo{background:var(--alerta-bg);border:1px solid #F0C9C9;border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--alerta);margin-bottom:16px}
.bloqueo strong{display:block;margin-bottom:2px}

/* Acciones */
.det-acciones{padding:16px 22px 22px;border-top:1px solid var(--borde);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none}
.boton-wa{background:var(--wa);color:#fff;flex:1 1 200px}
.boton-wa:hover{background:var(--wa-oscuro)}
.boton-correo{background:var(--agua);color:#fff;flex:1 1 200px}
.boton-correo:hover{background:var(--agua-oscuro)}
.boton-hecho{background:var(--superficie);color:var(--tinta);border:1px solid var(--borde);flex:0 0 auto}
.boton-hecho:hover{background:var(--fondo)}
.boton svg{width:18px;height:18px;flex-shrink:0}

.vacio-detalle{padding:80px 22px;text-align:center;color:var(--tinta-suave)}
.vacio-detalle .icono{font-size:32px;opacity:.4;margin-bottom:10px}

/* Aviso de "listo para enviar" */
.reloj{font-size:12px;color:var(--tinta-suave);display:flex;align-items:center;gap:5px}
.reloj.urgente{color:var(--alerta);font-weight:600}

@media(max-width:820px){
  .tablero{grid-template-columns:1fr;gap:14px}
  .detalle{position:static}
  .cola{max-height:none}
}

/* Pestañas Pendientes/Atendidos (usa la paleta 'agua' existente) */
.pestanas{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--borde)}
.pestana{background:none;border:none;padding:8px 14px;font-family:inherit;font-size:13.5px;
  font-weight:600;color:var(--tinta-suave);cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;display:flex;align-items:center;gap:7px;transition:color .12s,border-color .12s}
.pestana:hover{color:var(--agua-oscuro)}
.pestana.activa{color:var(--agua-oscuro);border-bottom-color:var(--agua)}
.pestana-num{background:var(--fondo);color:var(--tinta-suave);font-size:11px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;
  justify-content:center;padding:0 5px;border:1px solid var(--borde)}
.pestana.activa .pestana-num{background:var(--agua-claro);color:var(--agua-oscuro);border-color:var(--agua-claro)}
.cola-vacia{text-align:center;color:var(--tinta-suave);font-size:13.5px;padding:32px 16px;font-style:italic}

/* Modal de configuración (mismo patrón que el cotizador) */
.velo{position:fixed;inset:0;background:rgba(22,50,59,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.velo.visible{display:flex}
.modal{background:var(--superficie);border-radius:var(--radio);padding:26px;max-width:460px;width:100%}
.modal h3{margin-bottom:6px}
.modal p{font-size:13px;color:var(--tinta-suave);margin-bottom:16px}
.modal .campo{margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--tinta-suave);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:5px}
.modal input{width:100%;padding:11px 13px;border:1px solid var(--borde);border-radius:8px;font-size:14px;font-family:inherit}
.modal input:focus{outline:2px solid var(--agua);outline-offset:-1px;border-color:var(--agua)}
.modal .boton-guardar{width:100%;background:var(--agua);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.modal .boton-guardar:hover{background:var(--agua-oscuro)}
</style>
</head>
<body>

<!-- Configuración de conexión (una sola vez por navegador; mismo patrón que
     el cotizador). Aparece si falta backend o clave. -->
<div class="velo" id="veloConfig">
  <div class="modal">
    <h3>Conectar con Solón</h3>
    <p>Configuración de una sola vez en este navegador. Pide estos datos al administrador.</p>
    <div class="campo">
      <label for="confUrl">Dirección del backend</label>
      <input type="text" id="confUrl" value="https://klimm-backend.onrender.com">
    </div>
    <div class="campo">
      <label for="confClave">Clave de acceso</label>
      <input type="password" id="confClave" placeholder="Clave del backend">
    </div>
    <button class="boton-guardar" onclick="guardarConfig()">Guardar y empezar</button>
  </div>
</div>

<header>
  <div class="contenedor">
    <div class="marca">Klimm <span>· Agente</span></div>
    <div class="sistema">Sistema Solón</div>
  </div>
</header>

<div class="contenedor">
  <div class="tablero">

    <!-- Columna izquierda: la cola de leads que van llegando -->
    <div>
      <div class="cola-cabecera">
        <h2>Leads por atender</h2>
        <div class="cola-conteo"><strong id="conteoPendientes">0</strong> pendientes</div>
      </div>

      <!-- Pestañas. Hoy: Pendientes / Atendidos (F1). El contenedor deja
           lugar para sumar mañana "Seguimiento" (F2) como una pestaña más,
           sin rehacer la estructura. -->
      <div class="pestanas" id="pestanas">
        <button class="pestana activa" data-tab="pendientes" onclick="cambiarTab('pendientes')">
          Pendientes <span class="pestana-num" id="numPendientes">0</span>
        </button>
        <button class="pestana" data-tab="atendidos" onclick="cambiarTab('atendidos')">
          Atendidos <span class="pestana-num" id="numAtendidos">0</span>
        </button>
        <!-- Futuro F2: <button class="pestana" data-tab="seguimiento">Seguimiento</button> -->
      </div>

      <div class="cola" id="cola"></div>
    </div>

    <!-- Columna derecha: el lead seleccionado -->
    <div class="detalle" id="detalle">
      <div class="vacio-detalle">
        <div class="icono">◔</div>
        Elige un lead de la lista para ver el mensaje y enviarlo.
      </div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   PROTOTIPO — datos de ejemplo con la forma REAL de TarjetaF1
   (lo que devuelve procesarCorreoEntrante en primerContacto.js).
   El watcher IMAP, cuando exista, entregará objetos con esta
   misma forma. Aquí van precargados para ver el flujo.
   ============================================================ */

// Datos de EJEMPLO — se usan mientras el backend no entregue leads reales
// (el CRM aún no alimenta la cola). Cuando el backend responda, se reemplazan.
let LEADS = [
  {
    id: 'L1',
    hora: 'hace 2 min',
    minutos: 2,
    nuevo: true,
    // --- forma TarjetaF1 ---
    ok: true,

    mensaje: 'Buen día, Mariana. Le escribo de la empresa Klimm. Veo que le interesan escobas, mechudos y trapeadores industriales; con gusto le preparo una cotización.',

    avisos: [],

    enviado: false,

    personalizado: false,
    mensaje: 'Buen día, Lucía. Le escribo de la empresa Klimm. ¿En qué productos están interesados, para poder entregarles una propuesta?',
    waLink: 'https://wa.me/523331112222?text=' + encodeURIComponent('Buen día, Lucía. Le escribo de la empresa Klimm. ¿En qué productos están interesados, para poder entregarles una propuesta?'),

  {

    nuevo: false,
    // --- caso NO ENVIABLE: teléfono con formato raro ---
    ok: false,
    personalizado: true,
    mensaje: 'Buen día, Jorge. Le escribo de la empresa Klimm. Con gusto le comparto el catálogo y le preparo una cotización de los productos de limpieza que necesite.',
    waLink: null,
    lead: { nombre:'Jorge Méndez', empresa:'Hotelería del Pacífico', ubicacion:'Puerto Vallarta, Jalisco', texto:'Quiero catálogo o precios de mayoreo de productos de limpieza', telefono:'444-12', correo:'jorge.mendez@hoteleriapacifico.mx' },
    avisos: [],
    bloqueoEnvio: 'Teléfono con formato inesperado ("444-12"). Revisar antes de enviar.',
    correo: 'jorge.mendez@hoteleriapacifico.mx', // respaldo: algunos flujos lo dejan en la raíz
    enviado: false,
  },
  {
    id: 'L5',
    hora: 'hace 33 min',
    minutos: 33,
    nuevo: false,
    // --- nombre no usable: se redacta sin saludar por nombre + aviso ---
    ok: true,
    personalizado: true,
    mensaje: 'Buen día. Le escribo de la empresa Klimm. Veo que le interesa el jabón para manos a granel; con gusto le preparo una cotización.',
    waLink: 'https://wa.me/525598887777?text=' + encodeURIComponent('Buen día. Le escribo de la empresa Klimm. Veo que le interesa el jabón para manos a granel; con gusto le preparo una cotización.'),
    lead: { nombre:'.', empresa:'Corporativo GN', ubicacion:'CDMX', texto:'jabon para manos a granel', telefono:'55 9888 7777' },
    avisos: ['Nombre no usable para saludar ("."): se redactó sin dirigirse a nadie.'],
    bloqueoEnvio: null,
    enviado: false,
  },
  {
    id: 'L6',
    hora: 'hace 41 min',
    minutos: 41,
    nuevo: false,
    // --- caso REAL (sep-2026): teléfono BIEN escrito, pero el número NO tiene
    //     cuenta de WhatsApp. El parser no lo puede saber; solo se descubre al
    //     abrir el chat y rebotar. Por eso el correo debe estar SIEMPRE a la mano. ---
    ok: true,
    personalizado: true,
    mensaje: 'Buen día, Genesis. Le escribo de la empresa Klimm. Con gusto reviso su solicitud y le confirmo disponibilidad y precio.',
    waLink: 'https://wa.me/525931020079?text=' + encodeURIComponent('Buen día, Genesis. Le escribo de la empresa Klimm. Con gusto reviso su solicitud y le confirmo disponibilidad y precio.'),
    lead: { nombre:'Genesis', empresa:'Industria Abellux', ubicacion:'Estado de México', texto:'Necesito cotizar rollo Georgia Pacific Enmotion', telefono:'593 102 0079', correo:'compras@abellux.mx' },
    avisos: [],
    bloqueoEnvio: null,
    enviado: false,
  },
];

let activoId = LEADS[0].id;
const borradores = {}; // ediciones locales del operador

// --- Estado de pestañas -------------------------------------------------
// El panel maneja dos listas. Mientras vienen datos de EJEMPLO (un solo
// array LEADS), derivamos pendientes/atendidos de la bandera 'enviado'/'atendido'.
// Cuando el backend responde, el puente ya las entrega separadas.
let tabActiva = 'pendientes';

function listaPendientes(){
  return LEADS.filter(l => !(l.atendido || l.enviado));
}
function listaAtendidos(){
  return LEADS.filter(l => (l.atendido || l.enviado));
}
function listaActiva(){
  return tabActiva === 'atendidos' ? listaAtendidos() : listaPendientes();
}

function cambiarTab(tab){
  tabActiva = tab;
  // Al cambiar de pestaña, seleccionar el primero de esa lista (si hay).
  const lista = listaActiva();
  activoId = lista.length ? lista[0].id : null;
  document.querySelectorAll('.pestana').forEach(b => {
    b.classList.toggle('activa', b.dataset.tab === tab);
  });
  pintarCola();
  pintarDetalle();
}

const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/**
 * correoDe — devuelve el correo del lead venga donde venga. El watcher aún no
 * está encendido, así que no sabemos con certeza si lo dejará en l.lead.correo
 * o en l.correo. Leemos de ambos (primero el anidado) para no depender de eso
 * y de paso quitar el bug latente que apuntaba a 'mailto:undefined'.
 * Devuelve null si no hay correo utilizable.
 */
function correoDe(l){
  const c = (l && l.lead && l.lead.correo) || (l && l.correo) || '';
  return c && c.includes('@') ? c : null;
}

/**
 * armarMailto — construye el enlace mailto con el mensaje vigente. Por ahora el
 * cuerpo es el mismo texto que se ve en pantalla (editable por el operador).
 * La versión-correo redactada por la IA es una pieza aparte (backend), aún no
 * integrada; cuando llegue, solo cambia lo que se pasa como 'cuerpo' aquí.
 */
function armarMailto(correo, cuerpo){
  return 'mailto:' + correo
    + '?subject=' + encodeURIComponent('Klimm — su solicitud')
    + '&body=' + encodeURIComponent(cuerpo || '');
}

const iconoWA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C9.6 8.5 9 7 8.7 6.4c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.5-.3M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2m0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2"/></svg>';
const iconoMail = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
const iconoCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/></svg>';

function pintarCola(){
  const cola = $('#cola');
  const pend = listaPendientes();
  const aten = listaAtendidos();

  // Contadores (cabecera y pestañas)
  $('#conteoPendientes').textContent = pend.length;
  const nP = $('#numPendientes'), nA = $('#numAtendidos');
  if (nP) nP.textContent = pend.length;
  if (nA) nA.textContent = aten.length;

  const lista = listaActiva();

  if (!lista.length){
    cola.innerHTML = `<div class="cola-vacia">${
      tabActiva === 'atendidos'
        ? 'Aún no hay leads atendidos hoy.'
        : 'No hay leads pendientes. Todo al día.'
    }</div>`;
    return;
  }

  cola.innerHTML = lista.map(l => {
    const esAtendido = (l.atendido || l.enviado);
    const clases = ['lead-item'];
    if (l.id === activoId) clases.push('activo');
    if (esAtendido) clases.push('enviado');
    if (l.bloqueoEnvio) clases.push('bloqueado');
    if (l.nuevo && !esAtendido) clases.push('nuevo');

    let estado = '';
    if (esAtendido){
      estado = '<span class="chip chip-enviado">Atendido</span>';
    } else if (l.bloqueoEnvio){
      estado = '<span class="chip chip-rojo">Sin WhatsApp</span>';
    } else {
      estado = l.personalizado
        ? '<span class="chip chip-ia">Personalizado</span>'
        : '<span class="chip chip-base">Pregunta base</span>';
    }

    const pedido = l.lead.texto ? esc(l.lead.texto) : 'Sin mensaje';

    return `<div class="${clases.join(' ')}" onclick="seleccionar('${l.id}')">
      <div class="li-top">
        <div class="li-nombre">${(l.nuevo && !esAtendido) ? '<span class="pulso"></span> ' : ''}${esc(l.lead.nombre && l.lead.nombre.length>1 ? l.lead.nombre : (l.lead.empresa || 'Lead sin nombre'))}</div>
        <div class="li-hora">${esc(l.hora)}</div>
      </div>
      <div class="li-pedido">${pedido}</div>
      <div class="li-estado">${estado}</div>
    </div>`;
  }).join('');
}

function seleccionar(id){
  activoId = id;
  const l = LEADS.find(x => x.id === id);
  if (l) l.nuevo = false; // al abrirlo deja de ser "nuevo"
  pintarCola();
  pintarDetalle();
}

function pintarDetalle(){
  const l = LEADS.find(x => x.id === activoId);
  const det = $('#detalle');
  if (!l){ det.innerHTML = ''; return; }

  const bloqueado = !!l.bloqueoEnvio;
  det.className = 'detalle' + (bloqueado ? ' rojo' : '');

  const nombreVisible = (l.lead.nombre && l.lead.nombre.length > 1) ? l.lead.nombre : (l.lead.empresa || 'Lead sin nombre');
  const mensajeActual = (borradores[l.id] !== undefined) ? borradores[l.id] : l.mensaje;
  const editado = borradores[l.id] !== undefined && borradores[l.id] !== l.mensaje;

  // Meta (empresa / ubicación / teléfono)
  const meta = [];
  if (l.lead.empresa) meta.push(`<div class="campo"><div class="et">Empresa</div><div class="va">${esc(l.lead.empresa)}</div></div>`);
  if (l.lead.ubicacion) meta.push(`<div class="campo"><div class="et">Ubicación</div><div class="va">${esc(l.lead.ubicacion)}</div></div>`);
  meta.push(`<div class="campo"><div class="et">Teléfono</div><div class="va">${esc(l.lead.telefono || '—')}</div></div>`);

  // Reloj de R1
  const urgente = l.minutos >= 15;
  const reloj = l.enviado ? '' :
    `<div class="reloj ${urgente?'urgente':''}">${urgente?'⏱':'○'} llegó ${esc(l.hora)}</div>`;

  // Bloque de bloqueo (rojo)
  const bloqueoHTML = bloqueado
    ? `<div class="bloqueo"><strong>No se puede enviar por WhatsApp</strong>${esc(l.bloqueoEnvio)}</div>`
    : '';

  // Avisos del parser
  const avisosHTML = (l.avisos && l.avisos.length)
    ? l.avisos.map(a => `<div class="aviso">${esc(a)}</div>`).join('')
    : '';

  // Pedido del lead
  const pidioHTML = l.lead.texto
    ? `<div class="pidio-texto">"${esc(l.lead.texto)}"</div>`
    : `<div class="pidio-texto pidio-vacio">El lead no escribió nada. El mensaje usa la pregunta de Klimm.</div>`;

  const esAtendido = (l.atendido || l.enviado);

  // ¿Qué canales tiene este lead a la mano?
  const hayWa = !!l.waLink;                 // WhatsApp posible (teléfono usable)
  const hayCorreo = !!correoDe(l);          // correo disponible (venga de donde venga)

  // Botones individuales, para poder combinarlos según el estado.
  // El link de WhatsApp/correo se calcula EN EL CLIC (abrirWa/abrirCorreo)
  // leyendo el textarea, para que SIEMPRE use lo que el operador ve en pantalla.
  const btnWa = hayWa
    ? `<a class="boton boton-wa" href="${l.waLink}" target="_blank" onclick="return abrirWa('${l.id}', this)">${iconoWA} ${esAtendido ? 'Reintentar WhatsApp' : 'Abrir WhatsApp y enviar'}</a>`
    : '';
  const btnCorreo = hayCorreo
    ? `<a class="boton boton-correo" href="${armarMailto(correoDe(l), mensajeActual)}" onclick="return abrirCorreo('${l.id}', this)">${iconoMail} ${esAtendido ? 'Enviar por correo' : 'Abrir correo con el mensaje'}</a>`
    : '';

  // Acciones según estado
  let accionesHTML = '';
  if (l.enProceso){
    // Opción A: el clic ya abrió el canal; esperamos a que Odoo confirme el
    // avance de etapa antes de marcar Atendido. Feedback para el operador.
    accionesHTML = `<span style="font-size:13px;color:var(--tinta-suave);font-weight:600;display:flex;align-items:center;gap:6px">○ Registrando el contacto…</span>`;
  } else if (esAtendido){
    // Atendido ya NO es solo-lectura muerta. Sigue sin ser reenvío ciego: es
    // COMPLETAR un contacto que quizá rebotó (el número no tenía WhatsApp, o el
    // envío no salió). Se ofrecen los mismos canales del lead para rematar por
    // la vía que sí funcione. El texto es editable (abajo).
    const canales = [btnWa, btnCorreo].filter(Boolean).join('\n      ');
    accionesHTML = canales
      ? `<span style="font-size:12.5px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:6px;width:100%;margin-bottom:2px">${iconoCheck} Atendido${l.hora?' · '+esc(l.hora):''}</span>
      ${canales}`
      : `<span style="font-size:13px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:6px">${iconoCheck} Atendido${l.hora?' · '+esc(l.hora):''}</span>`;
  } else if (bloqueado){
    // Teléfono roto: WhatsApp no es opción; queda el correo (si lo hay).
    accionesHTML = (btnCorreo || `<span style="font-size:13px;color:var(--alerta)">Sin correo para responder — revisar el teléfono en Odoo.</span>`)
      + `\n      <button class="boton boton-hecho" onclick="marcarEnviado('${l.id}')">Ya lo atendí</button>`;
  } else {
    // Caso normal: WhatsApp como canal principal + correo al lado si existe
    // (para el número que resulta NO tener WhatsApp y rebota). Los dos visibles;
    // el operador elige. Ninguno es "el correcto" a ciegas.
    accionesHTML = [btnWa, btnCorreo].filter(Boolean).join('\n      ')
      + `\n      <button class="boton boton-hecho" onclick="marcarEnviado('${l.id}')">Ya lo atendí</button>`;
  }

  // El textarea es editable siempre que se pueda actuar sobre el lead. En
  // Atendidos también, porque se puede rematar por otro canal (con edición).
  // Solo queda en modo consulta si NO hay ningún canal para completar.
  const puedeEditar = !l.enProceso && (hayWa || hayCorreo);
  const textareaHTML = !puedeEditar
    ? `<div class="pidio-texto" style="font-style:normal">${esc(mensajeActual)}</div>`
    : `<div class="mensaje-caja">
          <textarea class="mensaje" id="ta-${l.id}" oninput="editar('${l.id}', this.value)">${esc(mensajeActual)}</textarea>
          <div class="mensaje-pie">
            <span class="mensaje-nota">${editado ? 'Editado — el botón usa tu versión.' : 'Puede ajustarlo antes de enviar.'}</span>
            ${editado ? `<button class="restaurar" onclick="restaurar('${l.id}')">Restaurar original</button>` : ''}
          </div>
        </div>`;

  // Aviso si el registro en Odoo falló (Opción A): el chat se abrió, pero la
  // etapa no avanzó. El lead sigue en Pendientes; se puede reintentar.
  const errorHTML = l.errorContacto
    ? `<div class="bloqueo"><strong>El mensaje se abrió, pero no se registró en Odoo</strong>El lead sigue en Pendientes. Vuelve a dar clic para reintentar el registro.</div>`
    : '';

  det.innerHTML = `
    <div class="det-cabecera ${bloqueado?'rojo':''}">
      <div class="det-nombre">${esc(nombreVisible)}</div>
      <div class="det-sub">${reloj}</div>
      <div class="det-meta">${meta.join('')}</div>
    </div>
    <div class="det-cuerpo">
      ${errorHTML}
      ${bloqueoHTML}
      <div class="bloque">
        <div class="bloque-et">Lo que pidió</div>
        ${pidioHTML}
      </div>
      <div class="bloque">
        <div class="bloque-et">${esAtendido ? 'Mensaje enviado' : ('Mensaje a enviar'+(l.personalizado?' · personalizado por IA':' · pregunta base de Klimm'))}</div>
        ${textareaHTML}
        ${avisosHTML}
      </div>
    </div>
    <div class="det-acciones">${accionesHTML}</div>
  `;
}

function editar(id, val){
  borradores[id] = val;
  const l = LEADS.find(x=>x.id===id);
  if (!l) return; // blindaje: si por lo que sea no se halla el lead, no tronar
                  // (un throw aquí rompería el flujo del clic de envío).
  // Solo actualizar el texto del pie (el link ya NO se toca aquí: abrirWa lo
  // calcula al hacer clic, leyendo el textarea. Así nada pisa las ediciones).
  const pie = $('.mensaje-nota');
  if (pie) pie.textContent = (val !== l.mensaje) ? 'Editado — el botón usa tu versión.' : 'Puede ajustarlo antes de enviar.';
  // Mostrar el botón "restaurar" si empezó a editar y aún no existe.
  if ((val !== l.mensaje) && !$('.restaurar')){ pintarDetalleSuave(id); }
}
function pintarDetalleSuave(id){
  // repinta pie conservando el valor editado y el foco
  const ta = document.getElementById('ta-'+id);
  const pos = ta ? ta.selectionStart : null;
  pintarDetalle();
  const ta2 = document.getElementById('ta-'+id);
  if (ta2 && pos!=null){ ta2.focus(); ta2.setSelectionRange(pos,pos); }
}

function restaurar(id){
  delete borradores[id];
  pintarDetalle();
}

/**
 * marcarEnviado — se dispara con el clic humano (botón WhatsApp o correo).
 * -----------------------------------------------------------------------
 * PASO 3 · OPCIÓN A (decisión sesión 4): el lead pasa a "Atendido" SOLO
 * cuando Odoo confirma que se movió a "Contactado". Así el panel nunca
 * miente: si dice Atendido, Odoo de verdad lo registró.
 *
 * Orden de lo que pasa al hacer clic:
 *   1. El navegador abre el chat de WhatsApp (o el correo) por su cuenta:
 *      es el href del <a>. Este onclick corre EN PARALELO, no lo estorba.
 *   2. Le pedimos al backend mover la etapa (avisarContactado).
 *   3. Si el backend responde ok -> marcamos el lead Atendido y repintamos.
 *      Si falla -> lo dejamos en Pendientes y avisamos discretamente, para
 *      que alguien reintente. NUNCA lo marcamos atendido "a ciegas".
 *
 * Compatibilidad con los datos de EJEMPLO: si el lead no tiene odooId (los
 * L1..L5 de prueba, que no vienen de Odoo), se comporta como antes —marca
 * atendido localmente— para no romper la demo sin backend.
 */
/**
 * abrirWa — se ejecuta AL HACER CLIC en "Abrir WhatsApp y enviar".
 * Lee el mensaje ACTUAL del textarea (con las ediciones del operador) en este
 * instante, arma el link wa.me fresco, lo pone en el botón, y dispara el
 * registro Nuevo→Contactado. Devuelve true para que el navegador siga el link.
 * Así el mensaje enviado SIEMPRE es el que el operador ve, nunca el original.
 */
function abrirWa(id, elemento){
  const l = LEADS.find(x=>x.id===id);
  if (!l || !l.waLink) return false;
  // El mensaje vigente: lo que haya en el textarea; si no, el borrador; si no, el original.
  const ta = document.getElementById('ta-'+id);
  const mensaje = ta ? ta.value : (borradores[id] !== undefined ? borradores[id] : l.mensaje);
  // Reconstruir el link con el mensaje vigente, justo antes de abrir.
  elemento.href = l.waLink.split('?text=')[0] + '?text=' + encodeURIComponent(mensaje);
  // Registrar el contacto (mueve la etapa en Odoo).
  marcarEnviado(id);
  return true; // deja que el navegador abra el href recién puesto
}

/**
 * abrirCorreo — gemelo de abrirWa para el canal de correo. Sirve en dos
 * momentos: cuando no hay WhatsApp posible (teléfono roto) y cuando SÍ lo había
 * pero rebotó (número sin cuenta) y se remata por correo desde Atendidos.
 * Nota: por ahora el cuerpo es el mismo texto que se ve en pantalla (editable).
 * La versión-correo redactada por la IA es pieza aparte (backend), aún no aquí.
 */
function abrirCorreo(id, elemento){
  const l = LEADS.find(x=>x.id===id);
  const correo = correoDe(l);
  if (!l || !correo) return false;
  const ta = document.getElementById('ta-'+id);
  const mensaje = ta ? ta.value : (borradores[id] !== undefined ? borradores[id] : l.mensaje);
  elemento.href = armarMailto(correo, mensaje);
  marcarEnviado(id);
  return true;
}

function marcarEnviado(id){
  const l = LEADS.find(x=>x.id===id);
  if (!l) return;
  l.nuevo = false; // en cualquier caso, ya dejó de ser "recién llegado"
  l.errorContacto = false; // si es un reintento, limpiar el aviso anterior

  // Caso demo / sin backend: sin odooId no hay a quién avisar en Odoo.
  // Mantener el comportamiento local de siempre.
  if (l.odooId === undefined || l.odooId === null || !BACKEND || !CLAVE){
    l.enviado = true;
    setTimeout(()=>{ pintarCola(); pintarDetalle(); }, 60);
    return;
  }

  // Opción A: esperar a Odoo. Marcamos "en proceso" para que el operador
  // vea que algo está pasando, sin afirmar todavía que quedó atendido.
  l.enProceso = true;
  setTimeout(()=>{ pintarCola(); pintarDetalle(); }, 60);

  avisarContactado(l.odooId).then((ok)=>{
    l.enProceso = false;
    if (ok){
      l.enviado = true;          // ahora sí: Odoo confirmó el avance de etapa
    } else {
      // No se pudo registrar: dejarlo pendiente y avisar para reintentar.
      l.errorContacto = true;
    }
    pintarCola(); pintarDetalle();
  });
}

/**
 * avisarContactado — le pide al backend mover el lead a "Contactado".
 * Devuelve Promise<boolean>: true si Odoo confirmó el avance (o el lead ya
 * estaba avanzado, que también cuenta como "registrado"); false si falló.
 */
async function avisarContactado(odooId){
  try {
    const resp = await fetch(BACKEND + RUTA_CONTACTADO, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-backend-key': CLAVE },
      body: JSON.stringify({ odooId }),
    });
    if (!resp.ok) return false;
    const data = await resp.json();
    // ok:true cubre 'movido' y 'ya-avanzado' (ambos = quedó registrado).
    return !!(data && data.ok);
  } catch (_) {
    return false; // sin red / backend caído: no confirmamos
  }
}
function deshacer(id){
  const l = LEADS.find(x=>x.id===id);
  if (l) l.enviado = false;
  pintarCola(); pintarDetalle();
}

// Arranque
pintarCola();
pintarDetalle();

/* ================= CONEXIÓN AL BACKEND (Solón) =================
   Mismo patrón que cotizador.html: guarda backend + clave en este navegador
   y llama con la cabecera x-backend-key. Mientras el backend no entregue
   leads, el panel muestra los datos de EJEMPLO de arriba. Cuando el endpoint
   responde, los reemplaza. NO rompe nada si no hay backend. */
const BACKEND_KEY = 'solon_backend', CLAVE_KEY = 'solon_clave';
let BACKEND = localStorage.getItem(BACKEND_KEY) || '';
let CLAVE   = localStorage.getItem(CLAVE_KEY)   || '';
const RUTA_COLA = '/agente/f1/cola';
const RUTA_CONTACTADO = '/agente/f1/contactado';

// Si falta configurar la conexión, mostrar el modal (mismo patrón cotizador).
if (!BACKEND || !CLAVE) {
  document.getElementById('veloConfig').classList.add('visible');
}

function guardarConfig(){
  const url = document.getElementById('confUrl').value.trim().replace(/\/$/,'');
  const clave = document.getElementById('confClave').value.trim();
  if (!url || !clave){ alert('Completa los dos campos'); return; }
  localStorage.setItem(BACKEND_KEY, url);
  localStorage.setItem(CLAVE_KEY, clave);
  BACKEND = url; CLAVE = clave;
  document.getElementById('veloConfig').classList.remove('visible');
  // Empezar a leer leads reales de inmediato con la config recién puesta.
  cargarLeadsReales();
}

// Cada cuánto el panel vuelve a pedir la cola (decisión: 5s).
const REFRESCO_PANEL_MS = 5000;
let backendVivo = false; // ¿el backend ya respondió con datos reales?

async function cargarLeadsReales(){
  if (!BACKEND || !CLAVE) return; // sin config -> quedarse con los de ejemplo
  try {
    const resp = await fetch(BACKEND + RUTA_COLA, {
      headers: { 'Content-Type':'application/json', 'x-backend-key': CLAVE }
    });
    if (!resp.ok) return; // 404/401 -> ejemplos, sin ruido
    const data = await resp.json();
    if (!data || data.ok === false) return; // backend sin datos -> ejemplos

    // El puente entrega { pendientes:[], atendidos:[], leads:[] }. Unificamos
    // en LEADS (con su bandera 'atendido'); las funciones derivan las listas.
    let nuevos = null;
    if (Array.isArray(data.leads)) {
      nuevos = data.leads;
    } else if (Array.isArray(data.pendientes) || Array.isArray(data.atendidos)) {
      nuevos = [...(data.pendientes||[]), ...(data.atendidos||[])];
    }
    if (!nuevos) return;

    backendVivo = true;

    // --- Refresco SIN perder el trabajo en curso ---
    // Conservar el lead abierto y cualquier borrador que se esté editando.
    const idAbierto = activoId;

    // Preservar estados TRANSITORIOS de un clic en curso (Opción A): si un
    // lead está "registrando" o quedó con error de registro, el refresco de
    // la cola NO debe borrar ese estado (la ventana es ~1s, pero real). Los
    // reponemos por odooId sobre los objetos nuevos.
    const transitorios = new Map();
    for (const viejo of LEADS){
      if (viejo && viejo.odooId != null && (viejo.enProceso || viejo.errorContacto)){
        transitorios.set(viejo.odooId, {
          enProceso: viejo.enProceso, errorContacto: viejo.errorContacto,
        });
      }
    }
    if (transitorios.size){
      for (const nuevo of nuevos){
        const t = nuevo && nuevo.odooId != null ? transitorios.get(nuevo.odooId) : null;
        if (t){ nuevo.enProceso = t.enProceso; nuevo.errorContacto = t.errorContacto; }
      }
    }

    LEADS = nuevos;

    // Si el lead que estaba abierto sigue existiendo, mantener la selección;
    // si desapareció (p.ej. pasó a atendido y estás en pendientes), elegir
    // el primero de la pestaña activa.
    const sigueVisible = LEADS.some(l => l.id === idAbierto);
    if (!sigueVisible) {
      const lista = listaActiva();
      activoId = lista.length ? lista[0].id : null;
    }

    pintarCola();
    // No repintar el detalle si el usuario está editando un borrador de ese
    // lead (para no interrumpir su escritura). Si no, repintar normal.
    const editandoAbierto = borradores[activoId] !== undefined
      && document.activeElement
      && document.activeElement.id === ('ta-' + activoId);
    if (!editandoAbierto) pintarDetalle();
  } catch (_) {
    // Backend dormido / sin red: seguir con lo que haya (ejemplos o última copia).
  }
}

// Arranque de la conexión + refresco periódico.
cargarLeadsReales();
setInterval(cargarLeadsReales, REFRESCO_PANEL_MS);
</script>
</body>
</html>
